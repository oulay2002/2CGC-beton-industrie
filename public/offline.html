<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors-ligne - 2CGC BTP & Béton</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #002B5B;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 440px;
      width: 100%;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .icon {
      font-size: 54px;
      margin-bottom: 16px;
      display: inline-block;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      color: #FFD700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      color: rgba(255, 255, 255, 0.85);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      color: #002B5B;
      font-weight: 800;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 14px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 215, 0, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .contact {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }
    .phone {
      color: #FFD700;
      font-weight: 700;
      text-decoration: none;
      display: block;
      margin-top: 6px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="width: 72px; height: 52px; background: white; border-radius: 14px; margin: 0 auto 16px auto; padding: 4px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.25);">
      <img src="/logo-2cgc.jpg" alt="Logo 2CGC" style="max-width: 100%; max-height: 100%; object-fit: contain;">
    </div>
    <h1>Vous êtes hors-ligne</h1>
    <p>
      Il semble que la connexion internet soit momentanément indisponible sur votre chantier ou appareil. Vos données déjà consultées restent accessibles.
    </p>
    <button class="btn" onclick="window.location.reload()">
      🔄 Réessayer la connexion
    </button>
    <div class="contact">
      Urgence chantier ou commande Daloa :
      <a class="phone" href="tel:+2250707434300">📞 +225 07 07 43 43 00</a>
    </div>
  </div>
</body>
</html>
